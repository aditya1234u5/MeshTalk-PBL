name: bitmesh_chat
description: BLE mesh chat app (BitChat-inspired) for PBL project
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12      # BLE central role: scan + connect + GATT client
  flutter_ble_peripheral: ^3.0.0   # BLE peripheral role: advertise + GATT server
  provider: ^6.1.2                 # simple state management
  uuid: ^4.4.0                     # peer IDs / message IDs
  cryptography: ^2.7.0             # X25519 key exchange + AES-GCM encryption
  permission_handler: ^11.3.1      # runtime BT/location permissions
  shared_preferences: ^2.2.3       # persist display name locally
  hive: ^2.2.3                     # local chat history persistence
  hive_flutter: ^1.1.0             # Hive + Flutter plugin bindings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
